name: CI/CD

on:
  push:
    branches: [develop, staging, main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [develop, staging, main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    name: Build & Test Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Frontend test (placeholder — no-ops until a real suite exists)
        run: npm test --if-present
        working-directory: frontend

      - name: Build frontend (Vite production build)
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:4000/api
          VITE_CLOUDINARY_CLOUD_NAME: placeholder
          VITE_CLOUDINARY_UPLOAD_PRESET: placeholder

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Backend test (placeholder — no-ops until a real suite exists)
        run: npm test --if-present
        working-directory: backend

  security-scan:
    name: Security Scan (Secrets + Dependency Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend dependencies
        # audit-ci.jsonc allowlists a small set of known, currently-unfixable
        # findings (documented inline in that file and in FX-025) so the
        # pipeline still blocks on anything new instead of being permanently
        # stuck on issues with no available fix yet.
        run: npm i --package-lock-only && npx --yes audit-ci@7.1.0 --config audit-ci.jsonc
        working-directory: backend
      - name: Audit frontend dependencies
        run: npm i --package-lock-only && npx --yes audit-ci@7.1.0 --config audit-ci.jsonc
        working-directory: frontend

  build-and-push:
    name: Build, Scan & Push Images (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image prefix and short SHA tag
        # GHCR repository paths must be all-lowercase; github.repository
        # preserves the owner's actual case ("OdarteiL/craftconnect").
        # The tag is derived from github.sha directly (not a shared step
        # output) so both matrix jobs -- and the later deploy job -- can
        # compute the identical value independently, without relying on
        # output propagation across a matrixed job.
        run: |
          echo "IMAGE_PREFIX=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_CLOUDINARY_CLOUD_NAME=${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
            VITE_CLOUDINARY_UPLOAD_PRESET=${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy scan (single pass — HIGH+CRITICAL to JSON, blocks only on CRITICAL)
        # One Trivy invocation instead of two: scan once to JSON (never
        # fails at the action level), then a jq step below both renders
        # the human-readable summary and decides pass/fail from the same
        # data, instead of running the full vulnerability DB match twice.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: json
          output: trivy-report.json

      - name: Publish report and fail on CRITICAL findings
        run: |
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
          {
            echo "### Trivy scan — ${{ matrix.image }} image ($CRITICAL_COUNT CRITICAL)"
            echo '```'
            jq -r '.Results[]?.Vulnerabilities[]? | "\(.Severity)\t\(.VulnerabilityID)\t\(.PkgName)\t\(.Title)"' trivy-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::$CRITICAL_COUNT CRITICAL vulnerabilities found in ${{ matrix.image }} image"
            exit 1
          fi

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Compute short SHA image tag
        # Matches build-and-push's ${GITHUB_SHA::7} derivation exactly.
        # Computed here (on the runner, via GitHub's own expression syntax)
        # rather than inside the SSH script block below -- GITHUB_SHA is a
        # runner-side env var and isn't set on the remote server at all.
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: SSH & deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export GHCR_USER=${{ github.actor }}
            export GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}
            bash /opt/craftconnect/scripts/deploy.sh

  promote:
    name: Open Promotion PR
    runs-on: ubuntu-latest
    needs: [build-test, security-scan]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine promotion target
        id: promo
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "base=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "base=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Open promotion PR (no-op if one already exists, human still merges)
        if: steps.promo.outputs.base != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --head "${{ github.ref_name }}" \
            --base "${{ steps.promo.outputs.base }}" \
            --title "Promote ${{ github.ref_name }} → ${{ steps.promo.outputs.base }}" \
            --body "Automated promotion PR opened after CI checks passed on \`${{ github.ref_name }}\` @ ${{ github.sha }}. This PR is never auto-merged — review and merge manually." \
            || true
